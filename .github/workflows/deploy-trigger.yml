name: Trigger production deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full lowercase commit SHA on main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-trigger
  cancel-in-progress: false

jobs:
  trigger:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Sign and send deployment webhook
        env:
          DEPLOY_HOOK_URL: ${{ vars.DEPLOY_HOOK_URL }}
          SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_SHA: ${{ inputs.target_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || { echo 'DEPLOY_HOOK_URL is missing' >&2; exit 1; }
          test -n "$SECRET" || { echo 'DEPLOY_HOOK_SECRET is missing' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            target_sha="$MANUAL_SHA"
          else
            target_sha="$WORKFLOW_SHA"
            [[ "$WORKFLOW_BRANCH" == main ]] || { echo 'workflow run is not for main' >&2; exit 1; }
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'target SHA must be 40 lowercase hex characters' >&2; exit 1; }
          body="$(printf '{"repository":{"full_name":"tviber/computing-lab"},"ref":"refs/heads/main","after":"%s"}' "$target_sha")"
          signature="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -r | cut -d' ' -f1)"
          curl --fail --retry 3 --retry-all-errors -X POST "$DEPLOY_HOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$body"
