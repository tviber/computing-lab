name: Deploy production over SSH

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full lowercase commit SHA on main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-trigger
  cancel-in-progress: false

jobs:
  trigger:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Verify target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.target_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            target_sha="$MANUAL_SHA"
          else
            target_sha="$WORKFLOW_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'target SHA must be 40 lowercase hex characters' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            conclusion="$(gh run list --repo "$REPOSITORY" --workflow ci.yml --branch main --event push \
              --commit "$target_sha" --limit 1 --json conclusion --jq '.[0].conclusion')"
            [[ "$conclusion" == success ]] || { echo 'target did not pass CI on main' >&2; exit 1; }
          fi
          printf 'RELEASE_SHA=%s\n' "$target_sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Transfer source and wait for production
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_HOST:?Missing SSH host}" "${DEPLOY_SSH_KEY:?Missing SSH key}" "${DEPLOY_SSH_KNOWN_HOSTS:?Missing SSH host key}"
          [[ "$DEPLOY_SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY
          bash deploy/send-release.sh ssh -T -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/key" "computing-lab-push@$DEPLOY_SSH_HOST"
